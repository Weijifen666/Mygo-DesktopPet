<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'">
    <title>MyGO!!!!! 桌宠</title>
    <link rel="icon" href="./assets/favicon.ico">
    <link rel="stylesheet" href="./desktop.css">
  </head>
  <body>
    <div id="quick-controls" aria-label="桌宠交互">
      <button id="quick-compose-toggle" class="desktop-tool-button" type="button" title="输入对话" aria-label="输入对话" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button id="quick-voice-toggle" class="desktop-tool-button" type="button" title="开启语音" aria-label="开启语音" aria-pressed="false"><svg class="voice-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><svg class="voice-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg></button>
      <button id="awareness-toggle" class="desktop-tool-button" type="button" title="开启桌面感知（仅识别前台应用名）" aria-label="开启桌面感知（仅识别前台应用名）" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></button>
      <button id="chat-toggle" class="desktop-tool-button" type="button" title="聊天记录与设置" aria-label="聊天记录与设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H8l-4 4Z"/><path d="M8 9h8M8 13h5"/></svg></button>
      <button id="hide-pet" class="desktop-tool-button" type="button" title="隐藏到托盘" aria-label="隐藏到托盘"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    </div>
    <div id="character-reply" role="status" title="点击收起" hidden>
      <span id="character-reply-text"></span>
    </div>
    <div id="voice-status" role="status" aria-live="polite" hidden></div>
    <form id="quick-form" hidden>
      <textarea id="quick-input" maxlength="4000" rows="2" placeholder="和她说点什么..." aria-label="快速聊天内容"></textarea>
      <button id="quick-send" class="send-button" type="submit" title="发送" aria-label="发送">➤</button>
    </form>
    <section id="chat-panel" aria-label="MyGO Agent 聊天">
      <header>
        <div>
          <strong>MyGO Agent</strong>
          <span id="agent-status">本地服务</span>
        </div>
        <div class="header-actions">
          <button id="voice-toggle" class="icon-button" type="button" title="开启语音" aria-label="开启语音">🔇</button>
          <button id="settings-toggle" class="icon-button" type="button" title="DeepSeek 设置" aria-label="DeepSeek 设置">⚙</button>
          <button id="chat-close" class="icon-button" type="button" title="关闭聊天" aria-label="关闭聊天">×</button>
        </div>
      </header>
      <div id="settings" hidden>
        <label for="api-key">DeepSeek API Key</label>
        <div class="key-row">
          <input id="api-key" type="password" autocomplete="off" placeholder="sk-...">
          <button id="save-key" type="button">保存</button>
        </div>
        <button id="clear-memory" class="quiet-button" type="button">清空对话与记忆</button>
      </div>
      <div id="messages" role="log" aria-live="polite"></div>
      <form id="chat-form">
        <textarea id="chat-input" maxlength="4000" rows="2" placeholder="和她说点什么..." aria-label="聊天内容"></textarea>
        <button id="send-message" class="send-button" type="submit" title="发送" aria-label="发送">➤</button>
      </form>
    </section>
    <script src="./widget-voice-bank.js"></script>
    <script src="./desktop.js"></script>
    <script src="./bootstrap-widget.js"></script>
  </body>
</html>
